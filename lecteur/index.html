<!DOCTYPE html>
<html lang="fr">

<head>

    <!-- ================================================= -->
    <!-- MÉTADONNÉES -->
    <!-- ================================================= -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Les Histoires de Ninayia
    </title>

    <!-- ================================================= -->
    <!-- POLICES -->
    <!-- ================================================= -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- ================================================= -->
    <!-- CSS -->
    <!-- ================================================= -->

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<!-- ================================================= -->
<!-- ÉCRAN D'ACCUEIL -->
<!-- ================================================= -->

<div
    class="home-screen"
    id="homeScreen">

    <!-- ================================ -->
    <!-- Couverture -->
    <!-- ================================ -->

    <img

        id="book"

        class="book-cover"

        src="../images/cover-kael-nayia-tome1.png"

        alt="Kaël & Nayia">

    <!-- ================================ -->
    <!-- Bouton -->
    <!-- ================================ -->

    <button

        id="openBook"

        class="open-button">

        <span>

            Ouvrir le livre

        </span>

    </button>

</div>

<!-- ================================================= -->
<!-- LECTEUR -->
<!-- ================================================= -->

<div

    class="reader"

    id="reader">

    <!-- ================================================= -->
    <!-- LIVRE -->
    <!-- ================================================= -->

    <div

        class="book"

        id="bookContainer">

        <!-- ============================================= -->
        <!-- RELIURE -->
        <!-- ============================================= -->

        <div class="spine"></div>
         <!-- ================================================= -->
        <!-- PAGE GAUCHE -->
        <!-- ================================================= -->

        <div
            class="page book-left"
            id="pageLeft">

            <div class="page-content">

                <img
                    id="leftImage"
                    class="page-image"
                    src=""
                    alt=""
                    style="display:none;">

                <p class="chapter-number"
                    id="leftChapter">

                </p>

                <h2
                    class="chapter-title"
                    id="leftTitle">

                </h2>

                <div class="separator"></div>

                <div
                    class="chapter-text"
                    id="leftText">

                </div>

            </div>

            <p
                class="page-number"
                id="leftPageNumber">

                1

            </p>

        </div>

        <!-- ================================================= -->
        <!-- PAGE DROITE -->
        <!-- ================================================= -->

        <div
            class="page book-right"
            id="pageRight">

            <div class="page-content">

                <img
                   id="rightImage"
                   class="page-image"
                   src=""
                   alt=""
                   style="display:none;">

                <p
    class="chapter-number"
    id="rightChapter">

</p>

<div class="chapter-top-decoration"></div>

<h2
    class="chapter-title"
    id="rightTitle">

</h2>

<div class="chapter-middle-decoration"></div>

<div class="separator"></div>

<div
    class="chapter-text"
    id="rightText">

</div>

            </div>

            <p
                class="page-number"
                id="rightPageNumber">

                2

            </p>

        </div>

    </div>     
    <!-- ================================================= -->
    <!-- BARRE DE NAVIGATION -->
    <!-- ================================================= -->

    <div class="reader-navigation">

        <button
            class="nav-button"
            id="previousPage">

            <img
                src="../images/previous.png"
                alt="Page précédente">

        </button>

        <button
            class="nav-button"
            id="openSummary">

            <img
                src="../images/sommaire.png"
                alt="Sommaire">

        </button>

        <button
            class="nav-button"
            id="goHome">

            <img
                src="../images/home.png"
                alt="Accueil">

        </button>

        <button
            class="nav-button"
            id="openSettings">

            <img
                src="../images/settings.png"
                alt="Paramètres">

        </button>

        <button
            class="nav-button"
            id="nextPage">

            <img
                src="../images/next.png"
                alt="Page suivante">

        </button>

    </div>

</div>

<!-- ================================================= -->
<!-- SOMMAIRE -->
<!-- ================================================= -->

<div
    class="summary-window"
    id="summaryWindow">

    <div class="summary-box">

        <h2>
            Sommaire
        </h2>

        <div id="summaryList">

        </div>

        <button
            class="summary-close"
            id="closeSummary">

            Fermer

        </button>

    </div>

</div>

<!-- ================================================= -->
<!-- PARAMÈTRES -->
<!-- ================================================= -->

<div
    class="settings-window"
    id="settingsWindow">

    <div class="settings-box">

        <h2>

            Paramètres

        </h2>

        <div class="settings-content">

        </div>

        <button
            class="settings-close"
            id="closeSettings">

            Fermer

        </button>

    </div>

</div>
<!-- ================================================= -->
<!-- SCRIPTS -->
<!-- ================================================= -->

<!-- ================================================= -->
<!-- SCRIPTS -->
<!-- ================================================= -->

<script src="../livres/tome1/couverture.js"></script>

<script src="../livres/tome1/chapitre1.js"></script>

<script src="../livres/tome1/chapitre2.js"></script>

<script src="../livres/tome1/chapitre3.js"></script>

<script src="../livres/tome1/chapitre4.js"></script>

<script src="../livres/tome1/tome1.js"></script>

<script src="script.js"></script>

</body>

</html>

</body>

</html>
