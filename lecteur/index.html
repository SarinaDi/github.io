<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lecteur - Les Histoires de Ninayia</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ================================================= -->
<!-- ÉCRAN D'ACCUEIL -->
<!-- ================================================= -->

<div class="home-screen">

    <img
        src="cover-kael-nayia-tome1.png"
        alt="Kaël & Nayia - Tome I"
        class="book-cover"
        id="book">

    <button
        class="open-button"
        id="openBook">

        <span>Ouvrir le livre</span>

    </button>

</div>

<!-- ================================================= -->
<!-- LECTEUR -->
<!-- ================================================= -->

<div class="reader" id="reader">

    <div class="book">

        <div class="spine"></div>

        <!-- ================================================= -->
        <!-- PAGE GAUCHE -->
        <!-- ================================================= -->

           <div
               class="page book-left"
                id="pageLeft">

            <div class="book-title">

                <p class="saga">
                    Kaël & Nayia
                </p>

                <p class="subtitle">
                    Saga : Le Prince des Enfers
                </p>

                <h1 id="leftTitle">Tome I</h1>

               <h2 id="leftSubtitle">
                Le Prince des Enfers
               </h2>
            </div>

            <p class="page-number">1</p>

        </div>

        <!-- ================================================= -->
        <!-- PAGE DROITE -->
        <!-- ================================================= -->

       <div
    class="page book-right"
    id="pageRight">

            <div class="chapter">

                <p
    class="chapter-number"
    id="chapterNumber">
                    Chapitre I
                </p>

                <h3 id="chapterTitle">
                    Une paix fragile
                </h3>

                <div class="separator"></div>

                <p id="chapterText">

Le royaume des Enfers n'était jamais réellement silencieux.

Même lorsque les flammes semblaient s'endormir...

</p>

                

            </div>

            <p class="page-number">2</p>

        </div>

    </div>

    <!-- ================================================= -->
    <!-- BARRE DE NAVIGATION -->
    <!-- ================================================= -->

    <div class="reader-navigation">

        <button class="nav-button" id="previousPage">
            <img src="previous.png" alt="Précédent">
        </button>

        <button class="nav-button" id="openSummary">
            <img src="sommaire.png" alt="Sommaire">
        </button>

        <button class="nav-button" id="goHome">
            <img src="home.png" alt="Accueil">
        </button>

        <button class="nav-button" id="openSettings">
            <img src="settings.png" alt="Paramètres">
        </button>

        <button class="nav-button" id="nextPage">
            <img src="next.png" alt="Suivant">
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
